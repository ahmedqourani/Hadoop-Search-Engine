<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <body>
    <main class="page">
      <section class="card" aria-label="Search">
        <h1 class="brand" aria-label="Home">Search</h1>

        <form class="search" action="/" method="get" role="search">
          <label class="sr-only" for="q">Search</label>
          <input
            class="search__input"
            id="q"
            name="q"
            type="search"
            placeholder="Search…"
            autocomplete="off"
            autofocus
            required
          />
          <button class="search__button" type="submit">Search</button>
        </form>

        <section class="results" aria-live="polite" aria-label="Results">
          <div class="results__meta" id="results-meta"></div>
          <ol class="results__list" id="results-list"></ol>
          <div id="results-pager" hidden style="display: flex; gap: 8px; margin-top: 12px; align-items: center;">
            <button class="search__button" type="button" id="prev-page">Previous</button>
            <div class="results__meta" id="page-meta"></div>
            <button class="search__button" type="button" id="next-page">Next</button>
          </div>
        </section>
      </section>
    </main>

    <script>
      (function () {
        const form = document.querySelector('form.search');
        const input = document.getElementById('q');
        const meta = document.getElementById('results-meta');
        const list = document.getElementById('results-list');
        const pager = document.getElementById('results-pager');
        const prevBtn = document.getElementById('prev-page');
        const nextBtn = document.getElementById('next-page');
        const pageMeta = document.getElementById('page-meta');

        let currentQuery = '';
        let currentPage = 1;
        let totalPages = 0;

        function setMeta(text) {
          meta.textContent = text;
        }

        function clearList() {
          while (list.firstChild) list.removeChild(list.firstChild);
        }

        function setPagerState(page, total) {
          totalPages = Number(total) || 0;
          currentPage = Number(page) || 1;

          const show = totalPages > 1;
          pager.hidden = !show;
          if (!show) return;

          prevBtn.disabled = currentPage <= 1;
          nextBtn.disabled = currentPage >= totalPages;
          pageMeta.textContent = `Page ${currentPage} of ${totalPages}`;
        }

        function renderResults(word, results, page, total) {
          clearList();

          if (!results.length) {
            setMeta(`No results for "${word}"`);
            setPagerState(1, 0);
            return;
          }

          // setMeta(`Results for "${word}" (${results.length})`);
          setPagerState(page, total);

          for (const r of results) {
            const li = document.createElement('li');

            const a = document.createElement('a');
            a.href = r.url;
            a.textContent = r.url;
            a.rel = 'noopener noreferrer';
            a.target = '_blank';

            const count = document.createElement('span');
            count.className = 'results__count';
            count.textContent = ` — ${r.count}`;

            li.appendChild(a);
            li.appendChild(count);
            list.appendChild(li);
          }
        }

        async function search(word, page) {
          const q = (word || '').trim();
          if (!q) return;

          currentQuery = q;
          currentPage = Number(page) || 1;

          setMeta('Searching…');
          clearList();
          pager.hidden = true;

          const url = new URL('/api/search', window.location.origin);
          url.searchParams.set('q', q);
          url.searchParams.set('page', String(currentPage));

          const res = await fetch(url.toString(), { headers: { Accept: 'application/json' } });
          if (!res.ok) {
            const text = await res.text();
            throw new Error(text || `Request failed (${res.status})`);
          }

          const data = await res.json();
          renderResults(data.word, data.results || [], data.page || currentPage, data.total_pages || 0);
        }

        function updateUrl(q, page) {
          const nextUrl = new URL(window.location.href);
          nextUrl.searchParams.set('q', q);
          nextUrl.searchParams.set('page', String(page));
          window.history.replaceState({}, '', nextUrl);
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const q = input.value;
          updateUrl(q, 1);

          try {
            await search(q, 1);
          } catch (err) {
            setMeta('Error searching (check server + DB).');
            clearList();
            console.error(err);
          }
        });

        prevBtn.addEventListener('click', async () => {
          if (currentPage <= 1) return;
          const nextPage = currentPage - 1;
          updateUrl(currentQuery, nextPage);
          try {
            await search(currentQuery, nextPage);
          } catch (err) {
            setMeta('Error searching (check server + DB).');
            clearList();
            console.error(err);
          }
        });

        nextBtn.addEventListener('click', async () => {
          if (!totalPages || currentPage >= totalPages) return;
          const nextPage = currentPage + 1;
          updateUrl(currentQuery, nextPage);
          try {
            await search(currentQuery, nextPage);
          } catch (err) {
            setMeta('Error searching (check server + DB).');
            clearList();
            console.error(err);
          }
        });

        const initialUrl = new URL(window.location.href);
        const initialQ = initialUrl.searchParams.get('q');
        const initialPage = Number(initialUrl.searchParams.get('page') || '1') || 1;
        if (initialQ) {
          input.value = initialQ;
          search(initialQ, initialPage).catch((err) => {
            setMeta('Error searching (check server + DB).');
            console.error(err);
          });
        }
      })();
    </script>
  </body>
</html>
